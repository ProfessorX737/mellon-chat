name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare_pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget jq
          wget -q https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64.tar.gz
          tar -xzf yq_linux_amd64.tar.gz
          sudo mv yq_linux_amd64 /usr/local/bin/yq

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          cache: true

      - name: Set up Rust
        uses: moonrepo/setup-rust@v1

      - name: Add Rust web component
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Prepare web dependencies
        run: ./scripts/prepare-web.sh

      - name: Build release web app
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --source-maps

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=mellon-chat-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
