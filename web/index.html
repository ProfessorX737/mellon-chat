<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-powered Matrix messenger.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mellon Chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Mellon Chat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="splash/style.css">
  <script src="Imaging.js"></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    (function () {
      var sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2);

      function safeString(value) {
        try {
          if (value === undefined) return undefined;
          if (value === null) return null;
          if (typeof value === 'string') return value;
          if (value && value.message) return String(value.message);
          return String(value);
        } catch (_) {
          return '[unstringifiable]';
        }
      }

      function postDebug(event, fields) {
        try {
          var payload = Object.assign({
            source: 'mellon-web-browser',
            event: event,
            session_id: sessionId,
            time: new Date().toISOString()
          }, fields || {});
          fetch('/__mellon_debug_logs', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
          }).catch(function () {});
        } catch (_) {}
      }

      window.__mellonDebugPost = postDebug;

      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && target !== window && (target.src || target.href)) {
          postDebug('mellon.browser.resource_error', {
            tag: target.tagName,
            url: target.src || target.href
          });
          return;
        }

        postDebug('mellon.browser.error', {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          error: safeString(event.error),
          stack: event.error && event.error.stack ? String(event.error.stack).split('\n').slice(0, 12).join('\n') : undefined
        });
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        postDebug('mellon.browser.unhandled_rejection', {
          reason: safeString(reason),
          stack: reason && reason.stack ? String(reason.stack).split('\n').slice(0, 12).join('\n') : undefined
        });
      });
    })();

    window.addEventListener('load', function (ev) {
      {{flutter_js}}
      {{flutter_build_config}}

      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer.initializeEngine({ useColorEmoji: true }).then(function (appRunner) {
          appRunner.runApp();
        });
      }
      });
    });
  </script>
  <picture id="splash">
    <source
      srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light) or (prefers-color-scheme: no-preference)">
    <source
      srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">
    <img class="center" src="splash/img/light-1x.png" />
  </picture>
</body>

</html>
